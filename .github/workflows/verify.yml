name: verify

on:
  push:
    branches: [master]
  pull_request:

jobs:
  scala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Der Kern und rich-text sind headless und unabhaengig vom scalajs-ui-Repository.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Formatierung
        run: sbt --server scalafmtCheckAll
      - name: Tests
        run: sbt --server "scalajs-ember-core/Test/testOnly *" "scalajs-ember-rich-text/Test/testOnly *"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Die Integrationsanwendung verwendet das veroeffentlichte scalajs-ui-core-Artefakt.
      # Ein Checkout des frueher benoetigten Nachbar-Repos ist deshalb nicht erforderlich.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Anwendung linken
        run: sbt --server "scalajs-ember-integration/fullLinkJS"
      - name: Harness einrichten
        working-directory: ember-integration/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      # Alle drei Engines. Firefox scheitert lokal unter Windows am Start des von Playwright
      # gelieferten Browsers; unter Linux laeuft er. Genau deshalb bleibt er hier drin.
      - name: Serverimport und Browser
        working-directory: ember-integration/browser
        run: npm run verify
